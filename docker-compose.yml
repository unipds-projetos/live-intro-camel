services:
  mysql:
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cotubify
      MYSQL_USER: admin
      MYSQL_PASSWORD: senha123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  rabbit:
    image: rabbitmq:4.2-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: senha123
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      # conf.d preserva o rabbitmq.conf gerado pela imagem a partir das variáveis de ambiente
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-load-definitions.conf:ro
      - ./rabbitmq/definitions-rabbit.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq_data:/var/lib/rabbitmq
  localstack:
    image: localstack/localstack:community-archive
    environment:
      SERVICES: s3
      DEBUG: 1
    ports:
      - '4566:4566'
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d:ro
  mailpit:
    image: axllent/mailpit:latest
    restart: always
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # UI web

volumes:
  mysql_data:
  rabbitmq_data: